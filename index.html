<form>

<input type="text" placeholder="Full Name" required>

<input type="tel" placeholder="Mobile Number" required>

<input type="text" placeholder="Drop Location" required>


<select name="travel_type" required>

    <option value="One Way">🚖 One Way</option>
    <option value="Round Trip">🔁 Round Trip</option>
    <option value="Outstation">🌄 Outstation</option>
    <option value="Airport Pickup">✈️ Airport Pickup</option>
    <option value="Airport Drop">🛬 Airport Drop</option>
    <option value="Local Rental">🏙️ Local Rental</option>
</select>

<label>Journey Date</label>
<input type="date" required>

<label>Journey Time</label>
<input type="time" required>

<select>
    <option value="">Choose Your Vehicles</option>
    <option>Swift / Aura</option>
    <option>Ertiga</option>
<option>Innova</option>
<option>Innova Crysta</option>
</select>
